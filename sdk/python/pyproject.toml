[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-sdk"
version = "0.1.0"
description = "Python client for running real Agent Eval experiments in user-owned runtimes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
  "openinference-semantic-conventions>=0.1.37,<0.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_eval*"]

[tool.setuptools.package-data]
agent_eval = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
