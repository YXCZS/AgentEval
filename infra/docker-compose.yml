services:
  web:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
        NEXT_PUBLIC_PROJECT_ID: ${NEXT_PUBLIC_PROJECT_ID:-default-project}
        NEXT_PUBLIC_WORKSPACE_SESSION: ${NEXT_PUBLIC_WORKSPACE_SESSION:-dev:default-project:local-compose-session-secret}
    ports:
      - "${AGENT_EVAL_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://agent_eval:agent_eval@postgres:5432/agent_eval}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_KEY_SALT: ${API_KEY_SALT:-local-compose-api-key-salt}
      WORKSPACE_SESSION_SECRET: ${WORKSPACE_SESSION_SECRET:-local-compose-session-secret}
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      AGENT_EVAL_BOOTSTRAP_ADMIN_EMAIL: ${AGENT_EVAL_BOOTSTRAP_ADMIN_EMAIL:-}
      AGENT_EVAL_BOOTSTRAP_ADMIN_PASSWORD: ${AGENT_EVAL_BOOTSTRAP_ADMIN_PASSWORD:-}
      AGENT_EVAL_CREDENTIAL_ENCRYPTION_KEY: ${AGENT_EVAL_CREDENTIAL_ENCRYPTION_KEY:-}
      AGENT_EVAL_CREDENTIAL_ENCRYPTION_KEY_ID: ${AGENT_EVAL_CREDENTIAL_ENCRYPTION_KEY_ID:-primary}
      AGENT_EVAL_EXTERNAL_EVALUATOR_SECRETS: '${AGENT_EVAL_EXTERNAL_EVALUATOR_SECRETS:-{}}'
    ports:
      - "${AGENT_EVAL_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://agent_eval:agent_eval@postgres:5432/agent_eval}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_KEY_SALT: ${API_KEY_SALT:-local-compose-api-key-salt}
      WORKSPACE_SESSION_SECRET: ${WORKSPACE_SESSION_SECRET:-local-compose-session-secret}
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      AGENT_EVAL_BOOTSTRAP_ADMIN_EMAIL: ${AGENT_EVAL_BOOTSTRAP_ADMIN_EMAIL:-}
      AGENT_EVAL_BOOTSTRAP_ADMIN_PASSWORD: ${AGENT_EVAL_BOOTSTRAP_ADMIN_PASSWORD:-}
      AGENT_EVAL_CREDENTIAL_ENCRYPTION_KEY: ${AGENT_EVAL_CREDENTIAL_ENCRYPTION_KEY:-}
      AGENT_EVAL_CREDENTIAL_ENCRYPTION_KEY_ID: ${AGENT_EVAL_CREDENTIAL_ENCRYPTION_KEY_ID:-primary}
      AGENT_EVAL_EXTERNAL_EVALUATOR_SECRETS: '${AGENT_EVAL_EXTERNAL_EVALUATOR_SECRETS:-{}}'
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A agent_eval_worker.celery_app:celery_app inspect ping --timeout=3 | grep -q pong"]
      interval: 10s
      timeout: 6s
      retries: 12

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    # 生产环境不要暴露数据库端口到宿主机，仅容器网络内可达。
    # 如需本机调试，临时取消注释下面这行。
    # ports:
    #   - "5432:5432"
    environment:
      POSTGRES_USER: agent_eval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_eval}
      POSTGRES_DB: agent_eval
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_eval -d agent_eval"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    # 生产环境不要暴露 Redis 端口到宿主机。
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
